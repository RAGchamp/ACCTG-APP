- id: receipt-use-tax
  title: Out-of-state online order with no CT tax charged -> use tax flag and OS-114 use tax
  area: Purchase receipts
  events:
    - type: purchase
      date: 2026-01-19
      vendor: Pizza Tools Direct (NH)
      payment: card
      no_tax: true
      invoice: true
      flags_expected: ["use tax"]
      expect: flag
      owner: [{action: accept, confirm: true}]
      items:
        - {desc: PIZZA PEELS 14IN X2, amount: 89.90, account: "6320", taxable: true}

