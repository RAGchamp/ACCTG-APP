- id: receipt-personal-item
  title: A personal item on a business receipt -> owner feedback moves it to Owner's draws
  area: Purchase receipts
  events:
    - type: purchase
      date: 2026-01-18
      vendor: Costco
      payment: card
      feedback: "The TV was for my home - personal, not business."
      items:
        - {desc: KS PEPPERONI 5LB, amount: 34.99, account: "5010"}
        - {desc: 55IN SMART TV, amount: 379.99, account: "3100", first_account: "6320", taxable: true}

- id: receipt-equipment
