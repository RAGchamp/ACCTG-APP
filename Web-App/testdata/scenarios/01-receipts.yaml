# Purchase receipts (plan §15.4). Amounts in dollars; accounts from the starter Chart of Accounts.
# Each scenario becomes its own sandbox: python -m testdata generate <id>
- id: receipt-card-matched
  title: Receipt paid by card, then matched to the card statement line (settles 2150)
  area: Purchase receipts
  events:
    - type: purchase
      date: 2026-01-14
      vendor: Restaurant Depot
      payment: card
      items:
        - {desc: WHOLE MILK MOZZ 6/5LB, qty: 2, amount: 84.98, account: "5010"}
        - {desc: PIZZA BOX 16IN 50CT, amount: 32.50, account: "5030", taxable: true}

- id: receipt-cash-split
  title: Cash receipt split across food, bags and cleaning supplies (7 lines -> 3 accounts)
  area: Purchase receipts
  events:
    - type: purchase
      date: 2026-01-09
      vendor: BJ's Wholesale
      payment: cash
      items:
        - {desc: ALL PURPOSE FLOUR 50LB, amount: 21.99, account: "5010"}
        - {desc: SAN MARZANO TOMATO 6/#10, amount: 38.40, account: "5010"}
        - {desc: TAKEOUT BAGS 500CT, amount: 18.75, account: "5030", taxable: true}
        - {desc: DEGREASER 1GAL, amount: 12.49, account: "6310", taxable: true}

