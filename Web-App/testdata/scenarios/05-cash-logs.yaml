- id: cash-log-crossed-out
  title: A cash sheet with a figure crossed out and rewritten
  area: Handwritten cash logs
  opening: {bank: "15000.00", cash: "400.00"}
  events:
    - {type: cash_log, date: 2026-01-16, cash_sales: "84.00", crossed_out: true}

- id: cash-log-illegible
  title: An illegible digit on a cash sheet -> [?], the owner confirms the figure
  area: Handwritten cash logs
  difficulty: messy
  opening: {bank: "15000.00", cash: "400.00", petty: "150.00"}
  events:
    - type: cash_log
      date: 2026-01-19
      cash_sales: "112.00"
      petty: [{desc: ice - gas station, amount: "12.50", account: "6310"}]
