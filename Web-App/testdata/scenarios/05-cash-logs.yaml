  opening: {bank: "15000.00", cash: "400.00", petty: "150.00"}
  events:
    - type: cash_log
      date: 2026-01-14
      cash_sales: "60.00"
      petty: [{desc: paper towels - CVS, amount: "8.99", account: "6310"}]
