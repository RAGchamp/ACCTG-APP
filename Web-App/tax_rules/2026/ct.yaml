  - {what: "CT-1040ES estimated tax, 3rd instalment", date: "2026-09-15", form: "CT-1040ES"}
  - {what: "CT-1040ES estimated tax, 4th instalment", date: "2027-01-15", form: "CT-1040ES"}
  - {what: "Hartford business personal property declaration (Oct 1 grand list) to the Hartford assessor", date: "2026-11-01", form: "Personal property declaration"}
  - {what: "CT-1040 for 2026", date: "2027-04-15", form: "CT-1040"}
